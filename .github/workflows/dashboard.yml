# Runs the model on a schedule and publishes the dashboard to GitHub Pages.
#
# Set-up, once:
#   1. Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#   2. Either set a repository variable FPL_TEAM_ID (your team's number from
#      the FPL site URL) so each run pulls your real squad, or commit a
#      my_squad.json - or neither, and pick your squad in the page itself
#   3. Actions tab -> "FPL dashboard" -> Run workflow, to test it now
#
# No secrets, no API keys, no server. The FPL API is public.

name: FPL dashboard

on:
  schedule:
    # Times are UTC. Nairobi is UTC+3, so 05:30 UTC is 08:30 for you.
    - cron: "30 5 * * *"      # every morning
    - cron: "0 15 * * 5"      # Friday afternoon, ahead of a typical deadline
  workflow_dispatch:           # and whenever you press the button

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes race each other.
concurrency:
  group: pages
  cancel-in-progress: true

# Machines and actions are pinned to known versions rather than "latest", so a
# change on GitHub's side (ubuntu-latest moved to Ubuntu 26 in October 2026)
# cannot quietly break the daily build. All of these run on Node 24.
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ~700 player history files barely change within a gameweek, so keep
      # them between runs. Without this every run re-downloads the lot.
      - name: Restore FPL cache
        uses: actions/cache@v5
        with:
          path: .fpl_cache
          key: fpl-cache-${{ github.run_id }}
          restore-keys: |
            fpl-cache-

      # Set FPL_TEAM_ID once (Settings -> Secrets and variables -> Actions ->
      # Variables) and every run pulls your actual squad from FPL - no file
      # to edit. my_squad.json still works as a fallback.
      - name: Build the dashboard
        env:
          FPL_TEAM_ID: ${{ vars.FPL_TEAM_ID }}
        run: |
          ARGS="--site _site --refresh --scorecard"
          if [ -n "$FPL_TEAM_ID" ]; then
            echo "Using FPL team id $FPL_TEAM_ID"
          fi
          if [ -f my_squad.json ]; then
            echo "my_squad.json present (used if the team id is unset or unavailable)"
            ARGS="$ARGS --squad my_squad.json"
          fi
          python run_fpl.py $ARGS

      - name: Check something was actually produced
        run: |
          test -s _site/index.html || { echo "::error::no dashboard produced"; exit 1; }
          echo "index.html is $(wc -c < _site/index.html) bytes"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true   # keep .nojekyll

      # A downloadable copy too, so a failed Pages deploy never loses the run.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fpl-dashboard
          path: |
            _site/index.html
            output/*.csv
          retention-days: 14
          if-no-files-found: warn

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
