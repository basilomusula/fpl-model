# Runs the model on a schedule and publishes the dashboard to GitHub Pages.
#
# Set-up, once:
#   1. Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#   2. Commit a my_squad.json in the repo root (optional - without one this
#      builds the best £100m squad from scratch instead)
#   3. Actions tab -> "FPL dashboard" -> Run workflow, to test it now
#
# No secrets, no API keys, no server. The FPL API is public.

name: FPL dashboard

on:
  schedule:
    # Times are UTC. Nairobi is UTC+3, so 05:30 UTC is 08:30 for you.
    - cron: "30 5 * * *"      # every morning
    - cron: "0 15 * * 5"      # Friday afternoon, ahead of a typical deadline
  workflow_dispatch:           # and whenever you press the button

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes race each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ~700 player history files barely change within a gameweek, so keep
      # them between runs. Without this every run re-downloads the lot.
      - name: Restore FPL cache
        uses: actions/cache@v4
        with:
          path: .fpl_cache
          key: fpl-cache-${{ github.run_id }}
          restore-keys: |
            fpl-cache-

      - name: Build the dashboard
        run: |
          if [ -f my_squad.json ]; then
            echo "Using my_squad.json"
            python run_fpl.py --squad my_squad.json --site _site --refresh
          else
            echo "No my_squad.json found - building an optimal squad instead"
            python run_fpl.py --site _site --refresh
          fi

      - name: Check something was actually produced
        run: |
          test -s _site/index.html || { echo "::error::no dashboard produced"; exit 1; }
          echo "index.html is $(wc -c < _site/index.html) bytes"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # A downloadable copy too, so a failed Pages deploy never loses the run.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fpl-dashboard
          path: |
            _site/index.html
            output/*.csv
          retention-days: 14
          if-no-files-found: warn

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
